<header class="site-header">

    <div class="header-container">

        <!-- Site Brand -->
        <a href="/" class="site-brand" aria-label="ইসলামি দৃষ্টিতে পরিবার ও দাম্পত্য জীবন">

            <img
                src="/images/favicon.png"
                alt="Islamic Light"
                class="site-logo"
                width="46"
                height="46"
            >

            <span class="brand-text">

                <span class="brand-title">
                    ইসলামি পরিবার
                </span>

                <span class="brand-subtitle">
                    পরিবার ও দাম্পত্য জীবন
                </span>

            </span>

        </a>


        <!-- Main Navigation -->
        <nav class="main-navigation"
             aria-label="প্রধান নেভিগেশন">

            <ul class="nav-list">

                <li class="nav-item">
                    <a href="/"
                       class="nav-link"
                       data-nav="home">
                        হোম
                    </a>
                </li>


                <li class="nav-item">
                    <a href="/articles.html"
                       class="nav-link"
                       data-nav="articles">
                        আর্টিকেল
                    </a>
                </li>


                <li class="nav-item">
                    <a href="/categories/dampotto-jibon.html"
                       class="nav-link"
                       data-nav="dampotto">
                        দাম্পত্য জীবন
                    </a>
                </li>


                <li class="nav-item">
                    <a href="/categories/bibaho.html"
                       class="nav-link"
                       data-nav="bibaho">
                        বিবাহ
                    </a>
                </li>


                <li class="nav-item">
                    <a href="/categories/family-life.html"
                       class="nav-link"
                       data-nav="family">
                        পরিবার
                    </a>
                </li>


                <li class="nav-item">
                    <a href="/questions.html"
                       class="nav-link"
                       data-nav="questions">
                        প্রশ্নোত্তর
                    </a>
                </li>


                <li class="nav-item">
                    <a href="/about.html"
                       class="nav-link"
                       data-nav="about">
                        আমাদের সম্পর্কে
                    </a>
                </li>

            </ul>

        </nav>


        <!-- Header Actions -->
        <div class="header-actions">

            <!-- Search -->
            <button
                type="button"
                class="header-action search-button"
                id="search-toggle"
                aria-label="অনুসন্ধান"
                aria-expanded="false"
                aria-controls="search-panel">

                <span aria-hidden="true">⌕</span>

            </button>


            <!-- Mobile Menu -->
            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="মেনু খুলুন"
                aria-expanded="false"
                aria-controls="main-navigation">

                <span class="menu-icon"
                      aria-hidden="true"></span>

            </button>

        </div>

    </div>


    <!-- Search Panel -->
    <div
        class="search-panel"
        id="search-panel"
        aria-hidden="true">

        <form
            class="search-form"
            action="/search.html"
            method="get"
            role="search">

            <label
                for="site-search"
                class="visually-hidden">
                কী খুঁজছেন?
            </label>

            <input
                type="search"
                id="site-search"
                name="q"
                class="search-input"
                placeholder="পরিবার ও দাম্পত্য জীবন সম্পর্কে খুঁজুন..."
                autocomplete="off"
                aria-label="ওয়েবসাইটে অনুসন্ধান করুন"
            >

            <button
                type="submit"
                class="search-submit">
                অনুসন্ধান
            </button>

        </form>
